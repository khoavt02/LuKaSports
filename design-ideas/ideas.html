<!doctype html><meta charset=utf-8><style>
body{margin:0;background:#0b0e14;color:#fff;font-family:Helvetica,Arial,sans-serif;width:1640px;padding:28px 30px 34px}
h1{margin:0 0 4px;font-size:30px;letter-spacing:.02em}p.sub{margin:0 0 22px;color:#9aa3b2;font-size:15px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.c{background:#151a24;border:1px solid #262d3b;border-radius:12px;padding:14px 10px 12px;text-align:center}
.c svg{width:300px;height:340px}.c b{display:block;font-size:19px;margin-top:6px}.c i{display:block;font-style:normal;color:#9aa3b2;font-size:13px;margin-top:3px}
</style>
<h1>DALETIC · Ý tưởng áo đấu lấy cảm hứng từ các đội tuyển lớn</h1>
<p class=sub>Bản phác họa vector để tham khảo bố cục màu và họa tiết. Không dùng logo, huy hiệu hay tên đội. Chừa vùng lưng cho tên – số, vùng ngực cho cờ và logo.</p>
<div class=g id=g></div>
<script>
const body="M95 20L60 36 10 95 48 125 78 100V320H222V100L252 125 290 95 240 36 205 20Q150 55 95 20Z";
const sleeveL="M60 36L10 95 48 125 78 100V50Z", sleeveR="M240 36L290 95 252 125 222 100V50Z";
const flag='<g transform="translate(196 64)"><path d="M0 0h26v16H0z" fill="#d9141c"/><path d="M13 3.2l1.6 3.8h4l-3.2 2.4 1.2 3.9-3.6-2.4-3.6 2.4 1.200-3.9-3.200-2.400h4z" fill="#ffd400" transform="scale(.9) translate(1.4 .8)"/></g>';
const D=(c)=>`<path d="M96 22Q150 56 204 22L190 18Q150 44 110 18Z" fill="${c}"/>`;
const cuff=(c)=>`<path d="M10 95L48 125" stroke="${c}" stroke-width="7"/><path d="M290 95L252 125" stroke="${c}" stroke-width="7"/>`;
const items=[
{n:"Thiên Hà",s:"Gợi nhớ sọc dọc xanh trời – trắng",bg:"#fff",bodyfill:"url(#p1)",trim:"#0f2a5e",extra:"",defs:'<pattern id=p1 width=36 height=10 patternUnits=userSpaceOnUse><rect width=36 height=10 fill=#fff /><rect width=18 height=10 fill=#7fc4f0 /></pattern>',sl:"#7fc4f0"},
{n:"Samba",s:"Vệt chéo lớn vàng – xanh lá – xanh dương",bg:"#ffd400",bodyfill:"#ffd400",trim:"#0a8f3c",extra:'<path d="M40 40L130 20 290 250 290 320 190 320Z" fill="#0a8f3c" opacity=.95/><path d="M40 40L130 20 290 250" stroke="#0b3d91" stroke-width="12" fill="none"/>',sl:"#ffd400"},
{n:"Lam Lãng",s:"Cam rực, sóng dọc đen ở hai bên sườn",bg:"#ff7a00",bodyfill:"#ff7a00",trim:"#111",extra:'<path id=w d="M84 90q-14 20 0 40t0 40 0 40 0 40 0 40" stroke="#111" stroke-width="7" fill="none"/><path d="M96 90q-14 20 0 40t0 40 0 40 0 40 0 40" stroke="#111" stroke-width="3" fill="none"/><path d="M216 90q14 20 0 40t0 40 0 40 0 40 0 40" stroke="#111" stroke-width="7" fill="none"/><path d="M204 90q14 20 0 40t0 40 0 40 0 40 0 40" stroke="#111" stroke-width="3" fill="none"/>',sl:"#ff7a00"},
{n:"Xếp Lớp",s:"Navy sâu, chevron mảnh kiểu gấp giấy",bg:"#102a5c",bodyfill:"url(#p4)",trim:"#fff",extra:"",defs:'<pattern id=p4 width=40 height=20 patternUnits=userSpaceOnUse><rect width=40 height=20 fill=#102a5c /><path d="M0 14l20-10 20 10" stroke=#fff stroke-opacity=.55 stroke-width=2 fill=none /></pattern>',sl:"#102a5c"},
{n:"Hổ Văn",s:"Đỏ, vằn hổ cách điệu đen",bg:"#d9141c",bodyfill:"#d9141c",trim:"#111",extra:'<g fill="#111"><path d="M78 110q40 6 60 30-30-4-60-14z"/><path d="M78 160q50 4 80 34-40-6-80-20z"/><path d="M78 215q60 6 100 44-50-10-100-28z"/><path d="M222 110q-40 6-60 30 30-4 60-14z"/><path d="M222 160q-50 4-80 34 40-6 80-20z"/><path d="M222 215q-60 6-100 44 50-10 100-28z"/></g>',sl:"#d9141c"},
{n:"Gạch Men",s:"Đỏ, họa tiết gạch men xanh lá chìm",bg:"#a30f17",bodyfill:"url(#p6)",trim:"#0b7a3b",extra:"",defs:'<pattern id=p6 width=30 height=30 patternUnits=userSpaceOnUse><rect width=30 height=30 fill=#a30f17 /><path d="M15 3l4 8 8 4-8 4-4 8-4-8-8-4 8-4z" fill=#0b7a3b opacity=.8 /></pattern>',sl:"#a30f17"},
{n:"Ô Vuông",s:"Ca-rô đỏ – trắng, nhạt dần xuống gấu",bg:"#fff",bodyfill:"url(#p7)",trim:"#1c4fa8",extra:'<rect x="60" y="150" width="190" height="180" fill="url(#fade)"/>',defs:'<pattern id=p7 width=40 height=40 patternUnits=userSpaceOnUse><rect width=40 height=40 fill=#fff /><rect width=20 height=20 fill=#d9141c /><rect x=20 y=20 width=20 height=20 fill=#d9141c /></pattern><linearGradient id=fade x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color=#fff stop-opacity=0 /><stop offset=1 stop-color=#fff stop-opacity=.92 /></linearGradient>',sl:"#fff"},
{n:"Tinh Gạch",s:"Xanh lá, gạch hình sao tám cánh vàng",bg:"#0b7a3b",bodyfill:"url(#p8)",trim:"#d9141c",extra:"",defs:'<pattern id=p8 width=34 height=34 patternUnits=userSpaceOnUse><rect width=34 height=34 fill=#0b7a3b /><rect x=9 y=9 width=16 height=16 fill=none stroke=#f2c14e stroke-width=2 /><rect x=9 y=9 width=16 height=16 fill=none stroke=#f2c14e stroke-width=2 transform="rotate(45 17 17)" /></pattern>',sl:"#0b7a3b"},
];
const g=document.getElementById('g');
items.forEach((it,i)=>{
 g.insertAdjacentHTML('beforeend',`<div class=c><svg viewBox="0 0 300 340"><defs>${it.defs||''}<clipPath id=cb${i}><path d="${body}"/></clipPath></defs>
 <g clip-path="url(#cb${i})"><rect width=300 height=340 fill="${it.bodyfill}"/>${it.extra}<path d="${sleeveL}" fill="${it.sl}" opacity=".0"/></g>
 <path d="${body}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="2"/>
 ${D(it.trim)}${cuff(it.trim)}${flag}
 <g fill="#fff"><path d="M118 108l16 8h30l16-8" fill="none"/></g></svg><b>${i+1}. ${it.n}</b><i>${it.s}</i></div>`);
});
</script>
