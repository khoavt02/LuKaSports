; Raises the default WordPress official-image limits (2M/8M), which are
; too small for camera-resolution product/category photos. Loaded via a
; conf.d drop-in so the base php.ini from the image is left untouched.
file_uploads = On
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
memory_limit = 256M
